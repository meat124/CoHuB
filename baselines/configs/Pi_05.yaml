# pi0.5 settings, as the environment variables its scripts read. Flat `KEY: value` lines.
# A variable already set in the calling shell wins over this file.
# The LoRA ranks are not settings: they are fixed in openpi's models/gemma.py.

# ---- run identity -----------------------------------------------------------
CKPT_TAG: cohub2                   # suffix on the checkpoint dir, the eval dirs and the wandb run
WANDB_PROJECT: CoHuB_Pi05

# ---- training: budget -------------------------------------------------------
PI05_BATCH_SIZE: 32
PI05_NUM_TRAIN_STEPS: 40000
PI05_SAVE_INTERVAL: 2000           # steps between checkpoints
PI05_KEEP_PERIOD: 10000            # checkpoints at multiples of this are kept

# ---- training: schedule -----------------------------------------------------
# Linear warm-up, then cosine from PI05_PEAK_LR to PI05_DECAY_LR.
PI05_WARMUP_STEPS: 1000
PI05_PEAK_LR: 2.5e-5
PI05_DECAY_LR: 2.5e-6

# ---- training: optimiser (AdamW) --------------------------------------------
PI05_ADAM_B1: 0.9
PI05_ADAM_B2: 0.95
PI05_ADAM_EPS: 1e-8
PI05_WEIGHT_DECAY: 1e-10
PI05_CLIP_GRAD_NORM: 1.0

# ---- training: validation ---------------------------------------------------
PI05_VAL_INTERVAL: 1000            # steps between validations
PI05_VAL_BATCHES: 16               # batches per validation

# ---- evaluation ------------------------------------------------------------
COHUB_EVAL_CKPTS: 20000 40000     # checkpoints to evaluate, by step
COHUB_EVAL_EPISODES: 100           # per task
COHUB_EVAL_SEED: 1                 # episode i runs at seed COHUB_EVAL_SEED + i
