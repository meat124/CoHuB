[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cohub-baselines"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6",
    "opencv-python-headless>=4.8,<5",  # 5.0 needs numpy>=2; DP, LatentToM and FastWAM pin numpy<2
    "h5py>=3.8",
    "websockets>=14.0",
    "msgpack>=1.0.8",
    "msgpack-numpy>=0.4.8",
    "pydantic>=2.5",
]

# One package rooted in this directory. Adapters import as `baselines.policy.<P>`.
[tool.setuptools]
package-dir = {"baselines" = "."}
packages = [
    "baselines",
    "baselines.client_server",
    "baselines.client_server.tcp",
    "baselines.client_server.ws",
    "baselines.client_server.ws.protocol",
    "baselines.utils",
]
