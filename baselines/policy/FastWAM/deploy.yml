policy_name: FastWAM
protocol: ws
eval_batch: false

# Server transport, set per launch by scripts/eval/runner.sh.
port: null
host: localhost

# Identifiers, set via --overrides from the eval scripts.
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
action_type: null
action_dim: null
seed: null
# Added to the episode seed that keys policy sampling.
policy_seed_salt: 0

# Policy artefacts, resolved from ckpt_name by scripts/eval/runner.sh.
checkpoint_path: null
dataset_stats_path: null

# CoHuB serving (bench_name=cohub): centralized loads one 70D policy,
# decentralized two 35D ones in the same server. model_dir* name weight files
# (step_*.pt) explicitly; empty means the newest step of the run named by
# ckpt_name/env_cfg_type/seed. checkpoint_num picks a step.
cohub_mode: null
# shared: one multitask policy drives both robots, told apart by instruction.
# per_robot: one checkpoint per (task, robot).
cohub_decentralized_style: shared
model_dir: null
model_dir_robot_a: null
model_dir_robot_b: null
ckpt_tag: null
checkpoint_num: null

# FastWAM policy hyperparameters. For cohub, model.py uses sim_cohub.yaml
# and derives the task yaml from env_cfg_type.
sim_cfg_name: sim_robotwin.yaml
sim_task: robotwin_uncond_3cam_384_1e-4
device: cuda
mixed_precision: bf16
# null: upstream default (num_frames - 1).
action_horizon: null
replan_steps: 24
num_inference_steps: 10
sigma_shift: null
text_cfg_scale: 1.0
negative_prompt: ""
rand_device: cpu
tiled: false
timing_enabled: false
# Used only when neither the env nor the dataset's tasks.jsonl names the task.
# Set `prompt` to override them.
default_instruction: follow the instruction
# CoHuB serving reads the T5 context from the precomputed cache
# (data/text_embeds_cache/XPolicyLab/<dataset_id>) and loads no text encoder.
# text_embedding_cache_dir overrides the derived cache dir.
# serve_text_encoder: true loads the live T5 encoder (needs a 48 GB card).
text_embedding_cache_dir: null
serve_text_encoder: false
# H.264 crf applied to incoming frames to match the training data. Keep 0 on
# CoHuB, whose env already serves decoded frames; use 20 for raw frames.
image_codec_crf: 0
allow_dummy_policy: false
