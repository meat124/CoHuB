name: lint

# Advisory only: it does not gate a merge.
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scripts this repository owns; the vendored framework's are upstream's.
      - run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning -x install.sh baselines/common.sh baselines/utils/*.sh \
            baselines/policy/*/*.sh baselines/logging/log.sh scripts/*/*.sh
        continue-on-error: true
